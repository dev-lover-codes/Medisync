        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            background-color: #faf9fa;
            background-image:

                radial-gradient(at 100% 100%, rgba(111, 86, 115, 0.1) 0px, transparent 50%);

<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<!-- Blurred Background Content (Dashboard Simulation) -->
<div class="fixed inset-0 z-0 overflow-hidden blur-xl opacity-40 scale-105 pointer-events-none">
<header class="flex items-center justify-between px-8 py-4 w-full bg-white/70">
<span class="text-2xl font-black text-purple-900 tracking-tight">MediSync</span>
<div class="flex gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-highest"></div>
</div>
</header>
<main class="p-8 grid grid-cols-12 gap-6">
<aside class="col-span-3 space-y-4">
<div class="h-12 w-full bg-surface-container-high rounded-xl"></div>
<div class="h-12 w-full bg-surface-container-high rounded-xl"></div>
<div class="h-12 w-full bg-surface-container-high rounded-xl"></div>
</aside>
<section class="col-span-9 grid grid-cols-2 gap-6">
<div class="h-64 bg-white rounded-xl shadow-sm"></div>
<div class="h-64 bg-white rounded-xl shadow-sm"></div>
<div class="col-span-2 h-96 bg-white rounded-xl shadow-sm"></div>
</section>
</main>
</div>
<!-- Success Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-on-background/10 backdrop-blur-md">
<!-- Centered Success Card -->
<div class="relative w-full max-w-lg bg-surface-container-lowest rounded-[2rem] shadow-[0_32px_64px_-12px_rgba(111,86,115,0.15)] overflow-hidden">

<div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-primary-container"></div>
<div class="p-8 md:p-10 flex flex-col items-center text-center">
<!-- Success Icon Wrapper -->
<div class="relative mb-6">
<div class="absolute inset-0 bg-primary/20 blur-2xl rounded-full scale-150"></div>
<div class="relative w-24 h-24 bg-primary rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 0, 'wght' 600;">check</span>
</div>
</div>
<!-- Messaging -->
<h1 class="font-headline text-3xl font-extrabold text-on-surface mb-2 tracking-tight">Appointment Confirmed!</h1>
<p class="text-on-surface-variant font-medium mb-8 max-w-xs">Your appointment has been successfully booked.</p>
<!-- Appointment ID Card (Dashed) -->
<div class="w-full bg-surface-container-low border-2 border-dashed border-outline-variant rounded-2xl p-4 mb-8 flex flex-col items-center">
<span class="text-[10px] font-bold tracking-widest text-outline uppercase mb-1">Appointment ID</span>
<span class="font-headline font-extrabold text-primary text-lg tracking-wider">APT-2026-4821</span>
</div>
<!-- Details Summary List -->
<div class="w-full space-y-4 mb-10">
<div class="flex items-center justify-between py-1 px-2">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl overflow-hidden shadow-sm">
<img alt="Dr. Anjali Sharma" class="w-full h-full object-cover" data-alt="portrait of a professional female doctor in a white coat smiling in a modern bright clinic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0Tq2fa2HyECJ5ABl8NEnlH1pFRu0zZVTrnBYLeq_YekXaD7w2T0X5PC4w1HxoGco-FMT8cVUBGTAOHxzpY8ImjkGMvS1nFwtMQTnZKu1lkkh9UTlpHOY6bse4XqXzL2ViPhmTK1T0GnhqnCBHVWuoTYiyNvfT4nHX9d4cU-p3u2aoy5nC3Mb4xsicD05a0_5MlipG2abwdCV7DKaSsbjFB1OcwKw7j42r1LGftRbvCTxtm1pgRnPge7NuB_FtGqQlKgQyFSaveeE"/>
</div>
<div class="text-left">
<p class="text-[11px] font-bold text-outline uppercase tracking-tight">Doctor</p>
<p class="font-semibold text-on-surface">Dr. Anjali Sharma</p>
</div>
</div>
<div class="text-right">
<p class="text-[11px] font-bold text-outline uppercase tracking-tight">Token</p>
<p class="font-headline font-extrabold text-primary text-xl">#14</p>
</div>
</div>
<div class="grid grid-cols-2 gap-4 border-t border-surface-container-high pt-4 px-2">
<div class="text-left">
<p class="text-[11px] font-bold text-outline uppercase tracking-tight mb-1">Date &amp; Time</p>
<div class="flex items-center gap-2 text-on-surface font-semibold text-sm">
<span class="material-symbols-outlined text-primary text-lg">calendar_today</span>
<span>April 14, 10:30 AM</span>
</div>
</div>
<div class="text-left">
<p class="text-[11px] font-bold text-outline uppercase tracking-tight mb-1">Type</p>
<div class="flex items-center gap-2 text-on-surface font-semibold text-sm">
<span class="material-symbols-outlined text-primary text-lg">person</span>
<span>In-person</span>
</div>
</div>
</div>
<div class="flex items-center justify-between bg-primary/5 rounded-2xl p-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-sm font-bold text-primary">Payment Successful</span>
</div>
<span class="font-headline font-extrabold text-on-surface">₹613.60</span>
</div>
</div>
<!-- Action Stack -->
<div class="w-full space-y-3">
<button class="w-full py-4 px-6 bg-gradient-to-r from-primary to-primary-container text-white font-bold rounded-full shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">event_available</span>
                        Add to Calendar
                    </button>
<button class="w-full py-4 px-6 bg-surface-container-high text-on-surface-variant font-bold rounded-full hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">download</span>
                        Download Appointment Slip
                    </button>
<button class="w-full py-3 px-6 text-primary font-bold rounded-full hover:bg-primary/5 transition-colors text-sm">
                        Go to My Appointments
                    </button>
</div>
</div>
<!-- Bottom Aesthetic Pattern -->
<div class="h-1 w-full bg-gradient-to-r from-transparent via-primary-container/30 to-transparent"></div>
